[project]
name = "ha-gigaset-ip"
version = "0.1.0"
description = "Local registration monitoring for Gigaset IP phone bases"
requires-python = ">=3.14.2,<3.15"
dependencies = ["aiohttp>=3.11"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "aioresponses>=0.7.8"]
ha = ["pytest-homeassistant-custom-component==0.13.375"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
